<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Websites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
            font-size: 28px;
        }
        .sites-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .site-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border: 2px solid #eee;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }
        .site-card:hover {
            border-color: #667eea;
            background: #f0f3ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        .site-card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .site-card p {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }
        .site-card .btn {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .site-card:hover .btn {
            background: #764ba2;
        }
        @media (max-width: 600px) {
            .sites-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Local Websites</h1>
        <div class="sites-grid">
            <a href="./travelnextlvl/travelnextlvl.de/index.html" class="site-card">
                <h2>🌍 Travel Next Lvl</h2>
                <p>Destinations and travel content</p>
                <button class="btn">Open Site</button>
            </a>
            <a href="./tomcardermedia/www.tomcardermedia.com/index.html" class="site-card">
                <h2>🎬 Tom Carder Media</h2>
                <p>Creative media and projects</p>
                <button class="btn">Open Site</button>
            </a>
        </div>
    </div>
</body>
</html>
